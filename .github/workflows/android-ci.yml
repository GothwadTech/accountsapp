name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Validate documentation and resources
        run: python3 tools/check_docs.py && python3 tools/check_android_scaffold.py
      - name: Test, lint, build and validate Maven publications
        run: >-
          ./gradlew --no-daemon :core:testDebugUnitTest :core:lintDebug :ui:lintDebug
          :app:lintDebug :sample:lintAlphaDebug :sample:lintBetaDebug
          :app:assembleDebug :sample:assembleAlphaDebug :sample:assembleBetaDebug
          :core:publishReleasePublicationToMavenLocal :ui:publishReleasePublicationToMavenLocal
